services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 1m

  php:
    image: php:8.2-fpm
    container_name: php_service
    environment:
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./html:/var/www/html
    command: sh -c "docker-php-ext-install mysqli && php-fpm"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html
      - ./css:/var/www/html/css
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php