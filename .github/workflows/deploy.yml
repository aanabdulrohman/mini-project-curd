name: CI Pipeline (Build Test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file for Testing
        run: |
          echo "DB_PASSWORD=testpass" > .env
          echo "DB_NAME=test_db" >> .env
          echo "DB_USER=root" >> .env

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build and Run Containers (Test)
        run: |
          docker compose up -d
          
      - name: Wait for MySQL Healthcheck
              run: |
                echo "Waiting for MySQL to be healthy..."
                # Timeout dinaikkan ke 120 detik (2 menit) untuk jaga-jaga di CI
                timeout 120s sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" mysql_db)" = "healthy" ]; do 
                  status=$(docker inspect -f "{{.State.Health.Status}}" mysql_db)
                  echo "Current MySQL Status: $status"
                  
                  if [ "$status" = "unhealthy" ]; then
                    echo "MySQL is unhealthy, showing logs:"
                    docker logs mysql_db
                    exit 1
                  fi
                  sleep 5
                done'

      - name: Check PHP Service Logs
        if: always()
        run: docker logs php_service

      - name: Stop and Cleanup
        if: always()
        run: docker compose down -v