name: CI Pipeline (Build Test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env file for Testing
        run: |
          echo "DB_PASSWORD=testpass" > .env
          echo "DB_NAME=test_db" >> .env

      - name: Validate Docker Compose Configuration
        run: docker-compose config

      - name: Build and Run Containers (Test)
        run: |
          docker-compose up -d
          
      - name: Wait for MySQL Healthcheck
        run: |
          echo "Waiting for MySQL to be healthy..."
          timeout 60s sh -c 'until [ "$(docker inspect -f {{.State.Health.Status}} mysql_db)" == "healthy" ]; do sleep 5; done'

      - name: Check PHP Service Logs
        if: always()
        run: docker logs php_service

      - name: Stop and Cleanup
        if: always()
        run: docker-compose down -v